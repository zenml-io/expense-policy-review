[project]
name = "expense-policy-review"
version = "0.1.0"
description = "Synthetic expense-policy review agent traced with Langfuse."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.0.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0.0",
    "langfuse>=3",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["expense_review"]

[tool.pytest.ini_options]
testpaths = ["tests"]
